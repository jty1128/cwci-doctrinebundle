
name: "Coding Standards"

on:
  pull_request:
    branches:
      - "cwci-39e4f4c8e527fefdab56-base"
    paths:
      - .github/workflows/coding-standards.yml
      - config/**
      - composer.*
      - phpcs.xml.dist
      - src/**
      - tests/**
permissions:
  contents: read

jobs:
  coding-standards:
    name: "Coding Standards"
    uses: "doctrine/.github/.github/workflows/coding-standards.yml@e57a8e33d799351a8c04f0b6d42e6568808a50d8"
    with:
      composer-options: "--prefer-dist --prefer-stable"
