
name: "Coding Standards"

on:
  pull_request:
    branches:
      - "cwci-2350-locked-v2-base"
    paths:
      - .github/workflows/coding-standards.yml
      - config/**
      - composer.*
      - phpcs.xml.dist
      - src/**
      - tests/**
permissions:
  contents: read

jobs:
  coding-standards:
    name: "Coding Standards"
    uses: "./.github/workflows/cwci-historical-coding.yml"
    with:
      composer-dependency-versions: "locked"
      composer-options: "--prefer-dist"
