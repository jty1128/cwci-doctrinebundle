
name: "Coding Standards"

on:
  pull_request:
    branches:
      - "cwci-59169935e4c3da32f2b9-base"
    paths:
      - .github/workflows/coding-standards.yml
      - config/**
      - composer.*
      - phpcs.xml.dist
      - src/**
      - tests/**
permissions:
  contents: read

jobs:
  coding-standards:
    name: "Coding Standards"
    uses: "doctrine/.github/.github/workflows/coding-standards.yml@630d3387930652e6fc3f5044b221527ba1c23740"
    with:
      composer-options: "--prefer-dist --prefer-stable"
